    <text x="24" y="214" font-size="14" font-weight="700" fill="#e6edf3">Currently</text>
    <text x="40" y="238" font-size="14"><tspan fill="#8b949e">- </tspan><tspan fill="#e6edf3">Building production-grade software</tspan></text>
    <text x="40" y="262" font-size="14"><tspan fill="#8b949e">- </tspan><tspan fill="#e6edf3">Contributing to open source</tspan></text>
    <text x="40" y="286" font-size="14"><tspan fill="#8b949e">- </tspan><tspan fill="#e6edf3">Learning system design</tspan></text>
  </g>

  <!-- status -->
  <g class="fade d3">
    <text x="24" y="324" font-size="14" font-weight="700" fill="#e6edf3">Status</text>
    <text x="40" y="348" font-size="14"><tspan fill="#8b949e">&gt; </tspan><tspan fill="#e6edf3">shipping code</tspan><tspan fill="#8b949e"> &gt; </tspan><tspan fill="#e6edf3">collecting certificates</tspan></text>
  </g>

  <!-- final prompt -->
  <g class="fade d4">
    <text x="24" y="392" font-size="14"><tspan fill="#3fb950">yash</tspan><tspan fill="#8b949e">@</tspan><tspan fill="#58a6ff">github</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#8b949e">~</tspan><tspan fill="#8b949e">$ </tspan></text>
    <rect x="146" y="380" width="8" height="15" fill="#e6edf3" class="cursor"/>
  </g>
</svg>
