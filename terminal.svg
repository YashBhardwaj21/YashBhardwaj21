<svg width="640" height="430" viewBox="0 0 640 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Yash Bhardwaj profile terminal">
  <title>~/profile</title>

  <defs>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </linearGradient>

    <filter id="panelShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    text{ font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; }

    .fade{ opacity:0; animation: fadeUp .55s ease forwards; }
    @keyframes fadeUp{
      from{ opacity:0; transform:translateY(6px); }
      to{ opacity:1; transform:translateY(0); }
    }
    .d0{ animation-delay:.15s; }
    .d1{ animation-delay:.60s; }
    .d2{ animation-delay:1.05s; }
    .d3{ animation-delay:1.55s; }
    .d4{ animation-delay:2.05s; }

    .cursor{ animation: blink 1s step-end infinite; animation-delay:2.4s; }
    @keyframes blink{ 50%{ opacity:0; } }

    .breathe{ animation: breathe 6s ease-in-out infinite; }
    @keyframes breathe{
      0%,100%{ stroke-opacity:0.10; }
      50%{ stroke-opacity:0.22; }
    }

    .icon-link:hover path, .icon-link:hover rect{ opacity:1; }
    .icon-link path, .icon-link rect{ opacity:0.82; transition: opacity .15s ease; }
  </style>

  <!-- panel -->
  <g filter="url(#panelShadow)">
    <rect x="8" y="8" width="624" height="414" rx="14" fill="url(#panelGrad)"/>
    <rect x="8" y="8" width="624" height="414" rx="14" fill="none" stroke="#e6edf3" stroke-width="1" class="breathe"/>
  </g>

  <!-- titlebar -->
  <line x1="8" y1="64" x2="632" y2="64" stroke="#ffffff" stroke-opacity="0.08"/>
  <circle cx="32" cy="32" r="7" fill="#ff5f56"/>
  <circle cx="58" cy="32" r="7" fill="#ffbd2e"/>
  <circle cx="84" cy="32" r="7" fill="#27c93f"/>
  <text x="320" y="38" text-anchor="middle" font-size="15" fill="#e6edf3">~/profile</text>

  <!-- social icons (decorative in this embed — see notes for clickable badge row) -->
  <line x1="508" y1="18" x2="508" y2="46" stroke="#ffffff" stroke-opacity="0.15"/>

  <a href="https://linkedin.com/in/itsyashbhardwaj" class="icon-link">
