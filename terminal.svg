  <line x1="624" y1="18" x2="624" y2="46" stroke="#ffffff" stroke-opacity="0.15"/>

  <!-- command line -->
  <text x="24" y="96" font-size="14">
    <tspan fill="#3fb950">yash</tspan><tspan fill="#8b949e">@</tspan><tspan fill="#58a6ff">github</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#8b949e">~</tspan><tspan fill="#8b949e">$ </tspan><tspan fill="#e6edf3" class="fade d0">cat ~/.profile</tspan>
  </text>

